<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双人对话播客合成系统</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入自定义 CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-5">双人对话播客合成系统</h1>
        
        <!-- 主内容区 -->
        <div class="row">
            <div class="col-lg-12">
                <!-- 标签页导航 -->
                <ul class="nav nav-tabs" id="podcastTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="inspiration-tab" data-bs-toggle="tab" data-bs-target="#inspiration" type="button" role="tab" aria-controls="inspiration" aria-selected="true">1. 灵感生成</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="script-tab" data-bs-toggle="tab" data-bs-target="#script" type="button" role="tab" aria-controls="script" aria-selected="false">2. 文稿生成</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="edit-tab" data-bs-toggle="tab" data-bs-target="#edit" type="button" role="tab" aria-controls="edit" aria-selected="false">3. 文稿编辑</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="voice-tab" data-bs-toggle="tab" data-bs-target="#voice" type="button" role="tab" aria-controls="voice" aria-selected="false">4. 语音设置</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="generate-tab" data-bs-toggle="tab" data-bs-target="#generate" type="button" role="tab" aria-controls="generate" aria-selected="false">5. 生成播客</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="result-tab" data-bs-toggle="tab" data-bs-target="#result" type="button" role="tab" aria-controls="result" aria-selected="false">6. 结果预览</button>
                    </li>
                </ul>
                
                <!-- 标签页内容 -->
                <div class="tab-content" id="podcastTabsContent">
                    <!-- 灵感生成 -->
                    <div class="tab-pane fade show active" id="inspiration" role="tabpanel" aria-labelledby="inspiration-tab">
                        <div class="mt-4">
                            <div class="mb-3">
                                <label for="topicInput" class="form-label">播客主题</label>
                                <input type="text" class="form-control" id="topicInput" placeholder="请输入播客主题，例如：人工智能的未来">
                            </div>
                            <button id="generateInspirationBtn" class="btn btn-primary">生成灵感</button>
                            <div id="inspirationResult" class="mt-3 p-3 border rounded"></div>
                        </div>
                    </div>
                    
                    <!-- 文稿生成 -->
                    <div class="tab-pane fade" id="script" role="tabpanel" aria-labelledby="script-tab">
                        <div class="mt-4">
                            <div class="mb-3">
                                <label for="inspirationInput" class="form-label">灵感内容</label>
                                <textarea class="form-control" id="inspirationInput" rows="8" placeholder="请输入或粘贴灵感内容"></textarea>
                            </div>
                            <div class="mb-3">
                                <label for="scriptLength" class="form-label">文稿长度（字符）</label>
                                <input type="number" class="form-control" id="scriptLength" value="2000" min="500" max="10000">
                            </div>
                            <button id="generateScriptBtn" class="btn btn-primary">生成文稿</button>
                            <div id="scriptResult" class="mt-3 p-3 border rounded"></div>
                        </div>
                    </div>
                    
                    <!-- 文稿编辑 -->
                    <div class="tab-pane fade" id="edit" role="tabpanel" aria-labelledby="edit-tab">
                        <div class="mt-4">
                            <div class="mb-3">
                                <label for="scriptEditor" class="form-label">播客文稿编辑器</label>
                                <textarea class="form-control" id="scriptEditor" rows="15" placeholder="请编辑播客文稿，使用 [A] 和 [B] 标记不同角色"></textarea>
                            </div>
                            <div class="d-flex gap-2">
                                <button id="optimizeScriptBtn" class="btn btn-primary">优化文稿</button>
                                <button id="validateScriptBtn" class="btn btn-secondary">验证格式</button>
                                <button id="copyScriptBtn" class="btn btn-success">复制文稿</button>
                            </div>
                            <div id="validationResult" class="mt-3"></div>
                        </div>
                    </div>
                    
                    <!-- 语音设置 -->
                    <div class="tab-pane fade" id="voice" role="tabpanel" aria-labelledby="voice-tab">
                        <div class="mt-4">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="card">
                                        <div class="card-header">
                                            角色 A 声音设置
                                        </div>
                                        <div class="card-body">
                                            <div class="mb-3">
                                                <label for="voiceA" class="form-label">选择声音</label>
                                                <select class="form-select" id="voiceA">
                                                    {% for voice in voices %}
                                                        <option value="{{ voice.id }}">{{ voice.name }}</option>
                                                    {% endfor %}
                                                </select>
                                            </div>
                                            <!-- 可以添加语速、音量、语调等设置 -->
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card">
                                        <div class="card-header">
                                            角色 B 声音设置
                                        </div>
                                        <div class="card-body">
                                            <div class="mb-3">
                                                <label for="voiceB" class="form-label">选择声音</label>
                                                <select class="form-select" id="voiceB">
                                                    {% for voice in voices %}
                                                        <option value="{{ voice.id }}" {% if loop.index == 2 %}selected{% endif %}>{{ voice.name }}</option>
                                                    {% endfor %}
                                                </select>
                                            </div>
                                            <!-- 可以添加语速、音量、语调等设置 -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 生成播客 -->
                    <div class="tab-pane fade" id="generate" role="tabpanel" aria-labelledby="generate-tab">
                        <div class="mt-4">
                            <h5>生成设置</h5>
                            <div class="mb-3">
                                <label for="finalScript" class="form-label">最终文稿</label>
                                <textarea class="form-control" id="finalScript" rows="10" placeholder="最终文稿将显示在这里"></textarea>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <button id="startGenerateBtn" class="btn btn-primary btn-lg">开始生成播客</button>
                                <div id="generationProgress" class="progress" style="width: 50%;">
                                    <div class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                            </div>
                            <div id="generationStatus" class="mt-3"></div>
                        </div>
                    </div>
                    
                    <!-- 结果预览 -->
                    <div class="tab-pane fade" id="result" role="tabpanel" aria-labelledby="result-tab">
                        <div class="mt-4">
                            <h5>播客生成结果</h5>
                            <div id="resultMessage" class="mt-3"></div>
                            <div id="audioPreview" class="mt-4"></div>
                            <div id="downloadSection" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入自定义 JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
