<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双人对话播客合成系统 | Podcast Studio</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 引入 Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- 引入 Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- 引入自定义 CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-5">
            <i class="bi bi-mic-fill"></i> 双人对话播客合成系统
        </h1>

        <!-- 主内容区 -->
        <div class="row">
            <div class="col-lg-12">
                <!-- 标签页导航 -->
                <ul class="nav nav-tabs" id="podcastTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="inspiration-tab" data-bs-toggle="tab" data-bs-target="#inspiration" type="button" role="tab" aria-controls="inspiration" aria-selected="true">
                            <i class="bi bi-lightbulb-fill me-2"></i>1. 灵感生成
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="script-tab" data-bs-toggle="tab" data-bs-target="#script" type="button" role="tab" aria-controls="script" aria-selected="false">
                            <i class="bi bi-file-text-fill me-2"></i>2. 文稿生成
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="edit-tab" data-bs-toggle="tab" data-bs-target="#edit" type="button" role="tab" aria-controls="edit" aria-selected="false">
                            <i class="bi bi-pencil-square me-2"></i>3. 文稿编辑
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="voice-tab" data-bs-toggle="tab" data-bs-target="#voice" type="button" role="tab" aria-controls="voice" aria-selected="false">
                            <i class="bi bi-soundwave me-2"></i>4. 语音设置
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="generate-tab" data-bs-toggle="tab" data-bs-target="#generate" type="button" role="tab" aria-controls="generate" aria-selected="false">
                            <i class="bi bi-magic me-2"></i>5. 生成播客
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="result-tab" data-bs-toggle="tab" data-bs-target="#result" type="button" role="tab" aria-controls="result" aria-selected="false">
                            <i class="bi bi-play-circle-fill me-2"></i>6. 结果预览
                        </button>
                    </li>
                </ul>
                
                <!-- 标签页内容 -->
                <div class="tab-content" id="podcastTabsContent">
                    <!-- 灵感生成 -->
                    <div class="tab-pane fade show active" id="inspiration" role="tabpanel" aria-labelledby="inspiration-tab">
                        <div class="mt-4">
                            <div class="mb-4">
                                <label for="topicInput" class="form-label">
                                    <i class="bi bi-chat-dots me-2"></i>播客主题
                                </label>
                                <input type="text" class="form-control" id="topicInput" placeholder="请输入播客主题，例如：人工智能的未来">
                            </div>
                            <button id="generateInspirationBtn" class="btn btn-primary">
                                <i class="bi bi-stars me-2"></i>生成灵感
                            </button>
                            <div id="inspirationResult" class="mt-3 p-3 border rounded"></div>
                        </div>
                    </div>

                    <!-- 文稿生成 -->
                    <div class="tab-pane fade" id="script" role="tabpanel" aria-labelledby="script-tab">
                        <div class="mt-4">
                            <div class="mb-4">
                                <label for="inspirationInput" class="form-label">
                                    <i class="bi bi-lightbulb me-2"></i>灵感内容
                                </label>
                                <textarea class="form-control" id="inspirationInput" rows="8" placeholder="请输入或粘贴灵感内容"></textarea>
                            </div>
                            <div class="mb-4">
                                <label for="scriptLength" class="form-label">
                                    <i class="bi bi-aspect-ratio me-2"></i>文稿长度（字符）
                                </label>
                                <input type="number" class="form-control" id="scriptLength" value="2000" min="500" max="10000">
                            </div>
                            <button id="generateScriptBtn" class="btn btn-primary">
                                <i class="bi bi-file-earmark-text me-2"></i>生成文稿
                            </button>
                            <div id="scriptResult" class="mt-3 p-3 border rounded"></div>
                        </div>
                    </div>
                    
                    <!-- 文稿编辑 -->
                    <div class="tab-pane fade" id="edit" role="tabpanel" aria-labelledby="edit-tab">
                        <div class="mt-4">
                            <h5 class="mb-3"><i class="bi bi-sliders me-2"></i>文稿编辑与情绪配置</h5>
                            <p class="text-muted mb-4">支持逐句情绪、语速、语调调节，格式：[A](happy,1.2,0): 文本内容</p>

                            <div class="row">
                                <!-- 左侧：文本编辑器 -->
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="scriptEditor" class="form-label">
                                            <i class="bi bi-code-square me-2"></i>播客文稿编辑器
                                        </label>
                                        <textarea class="form-control" id="scriptEditor" rows="20" placeholder="请编辑播客文稿，使用 [A] 和 [B] 标记不同角色"></textarea>
                                    </div>
                                    <div class="d-flex gap-2 flex-wrap">
                                        <button id="optimizeScriptBtn" class="btn btn-primary">
                                            <i class="bi bi-wand me-2"></i>优化文稿
                                        </button>
                                        <button id="validateScriptBtn" class="btn btn-secondary">
                                            <i class="bi bi-check-circle me-2"></i>验证格式
                                        </button>
                                        <button id="copyScriptBtn" class="btn btn-success">
                                            <i class="bi bi-clipboard me-2"></i>复制文稿
                                        </button>
                                    </div>
                                    <div id="validationResult" class="mt-3"></div>
                                </div>

                                <!-- 右侧：情绪配置面板 -->
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label">
                                            <i class="bi bi-emoji-smile me-2"></i>情绪参数配置
                                        </label>
                                        <div id="emotionConfigPanel" style="max-height: 500px; overflow-y: auto;"></div>
                                    </div>
                                    <div class="mt-3">
                                        <button id="refreshEmotionPanelBtn" class="btn btn-info">
                                            <i class="bi bi-arrow-clockwise me-2"></i>刷新情绪配置
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 语音设置 -->
                    <div class="tab-pane fade" id="voice" role="tabpanel" aria-labelledby="voice-tab">
                        <div class="mt-4">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="card">
                                        <div class="card-header">
                                            <i class="bi bi-person-fill me-2"></i>角色 A 声音设置
                                        </div>
                                        <div class="card-body">
                                            <div class="mb-3">
                                                <label for="voiceA" class="form-label">
                                                    <i class="bi bi-mic me-2"></i>选择声音
                                                </label>
                                                <!-- 隐藏原生 select，用于存储实际值 -->
                                                <select class="form-select d-none" id="voiceA">
                                                    {% for voice in voices %}
                                                        <option value="{{ voice.id }}">{{ voice.name }}</option>
                                                    {% endfor %}
                                                </select>
                                                <!-- Bootstrap Dropdown 组件 -->
                                                <div class="dropdown">
                                                    <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button" id="voiceADropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                                        <i class="bi bi-soundwave me-2"></i>
                                                        {% if voices and voices|length > 0 %}{{ voices[0].name }}{% else %}APIKey不可用，请输入APIKey{% endif %}
                                                    </button>
                                                    <ul class="dropdown-menu select-scrollable w-100" aria-labelledby="voiceADropdown" style="max-height: 300px; overflow-y: auto;">
                                                        {% for voice in voices %}
                                                            <li><a class="dropdown-item" href="#" data-value="{{ voice.id }}"><i class="bi bi-person me-2"></i>{{ voice.name }}</a></li>
                                                        {% endfor %}
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card">
                                        <div class="card-header">
                                            <i class="bi bi-person-fill-gear me-2"></i>角色 B 声音设置
                                        </div>
                                        <div class="card-body">
                                            <div class="mb-3">
                                                <label for="voiceB" class="form-label">
                                                    <i class="bi bi-mic me-2"></i>选择声音
                                                </label>
                                                <!-- 隐藏原生 select，用于存储实际值 -->
                                                <select class="form-select d-none" id="voiceB">
                                                    {% for voice in voices %}
                                                        <option value="{{ voice.id }}" {% if loop.index == 2 %}selected{% endif %}>{{ voice.name }}</option>
                                                    {% endfor %}
                                                </select>
                                                <!-- Bootstrap Dropdown 组件 -->
                                                <div class="dropdown">
                                                    <button class="btn btn-outline-secondary dropdown-toggle w-100 text-start" type="button" id="voiceBDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                                        <i class="bi bi-soundwave me-2"></i>
                                                        {% if voices and voices|length > 1 %}{{ voices[1].name }}{% elif voices and voices|length > 0 %}{{ voices[0].name }}{% else %}APIKey不可用，请输入APIKey{% endif %}
                                                    </button>
                                                    <ul class="dropdown-menu select-scrollable w-100" aria-labelledby="voiceBDropdown" style="max-height: 300px; overflow-y: auto;">
                                                        {% for voice in voices %}
                                                            <li><a class="dropdown-item" href="#" data-value="{{ voice.id }}"><i class="bi bi-person me-2"></i>{{ voice.name }}</a></li>
                                                        {% endfor %}
                                                    </ul>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 生成播客 -->
                    <div class="tab-pane fade" id="generate" role="tabpanel" aria-labelledby="generate-tab">
                        <div class="mt-4">
                            <h5 class="mb-4"><i class="bi bi-gear-fill me-2"></i>生成设置</h5>
                            <div class="mb-4">
                                <label for="finalScript" class="form-label">
                                    <i class="bi bi-file-earmark-check me-2"></i>最终文稿
                                </label>
                                <textarea class="form-control" id="finalScript" rows="10" placeholder="最终文稿将显示在这里"></textarea>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                                <button id="startGenerateBtn" class="btn btn-primary btn-lg">
                                    <i class="bi bi-play-fill me-2"></i>开始生成播客
                                </button>
                                <div id="generationProgress" class="progress" style="width: 50%; min-width: 300px;">
                                    <div class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                            </div>
                            <div id="generationStatus" class="mt-3"></div>
                        </div>
                    </div>

                    <!-- 结果预览 -->
                    <div class="tab-pane fade" id="result" role="tabpanel" aria-labelledby="result-tab">
                        <div class="mt-4">
                            <h5 class="mb-4"><i class="bi bi-trophy-fill me-2"></i>播客生成结果</h5>
                            <div id="resultMessage" class="mt-3"></div>
                            <div id="audioPreview" class="mt-4"></div>
                            <div id="downloadSection" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 引入自定义 JS -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
