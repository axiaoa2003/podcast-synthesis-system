<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>API 测试页面</h1>
        
        <div class="mb-3">
            <label for="testScript" class="form-label">测试文稿</label>
            <textarea class="form-control" id="testScript" rows="8">[A]：太棒了。这完全是把视角从病理学转向了特质光谱。那么，这些特质——比如强大的发散思维、创造力——在工作和创造场景中，AI如何帮助它们更好地发挥，而不是被压抑？这就到了我们最后的主题：创造力与职业适配。
[B]：没错。首先，对于**创造力**，ADHD的发散思维是宝藏，但如何收拢成一个可执行的方案，往往是难点。AI工具在这里是绝佳的“思维协作者”。比如，你用**思维导图**软件，天马行空地输入一堆关键词。AI可以帮你自动分类、建立你没想到的联系、甚至建议一个逻辑结构。或者，你用**创意生成器**，输入一个模糊的概念，AI可以生成多个方向的原型、文案或视觉风格，供你选择和深化。它就像一个永不疲倦的“外接大脑”，负责处理结构化和延伸性的工作，让你可以更自由地停留在创意迸发的“发散阶段”，同时确保最终能落地。</textarea>
        </div>
        
        <button id="testBtn" class="btn btn-primary">测试 API</button>
        
        <div class="mt-3">
            <h5>测试结果</h5>
            <div id="testResult" class="border p-3 rounded"></div>
        </div>
    </div>

    <script>
        document.getElementById('testBtn').addEventListener('click', async () => {
            const script = document.getElementById('testScript').value;
            const resultDiv = document.getElementById('testResult');
            const testBtn = document.getElementById('testBtn');
            
            testBtn.disabled = true;
            testBtn.textContent = '测试中...';
            resultDiv.innerHTML = '<div class="alert alert-info">正在测试 API...</div>';
            
            try {
                // 调用验证文稿 API
                const validateResponse = await fetch('/api/validate-script', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ script })
                });
                
                const validateData = await validateResponse.json();
                
                // 调用合成音频 API
                const synthResponse = await fetch('/api/synthesize-audio', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        script,
                        voice_a: 'male-qn-qingse',
                        voice_b: 'male-qn-qingse'
                    })
                });
                
                const synthData = await synthResponse.json();
                
                // 显示结果
                resultDiv.innerHTML = `
                    <h6>验证文稿结果：</h6>
                    <pre>${JSON.stringify(validateData, null, 2)}</pre>
                    <h6>合成音频结果：</h6>
                    <pre>${JSON.stringify(synthData, null, 2)}</pre>
                `;
                
                // 如果合成成功，显示音频播放器
                if (synthData.success) {
                    let audioUrl = synthData.audio_url;
                    if (!audioUrl.startsWith('static/')) {
                        audioUrl = `static/${audioUrl}`;
                    }
                    
                    resultDiv.innerHTML += `
                        <h6>音频预览：</h6>
                        <audio controls>
                            <source src="${audioUrl}" type="audio/mpeg">
                            您的浏览器不支持音频播放。
                        </audio>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">测试失败：${error.message}</div>`;
            } finally {
                testBtn.disabled = false;
                testBtn.textContent = '测试 API';
            }
        });
    </script>
</body>
</html>
